name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings

  test:
    name: Tests (Rust ${{ matrix.rust }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: cargo test --locked
      - env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: cargo build --release --locked
      - run: python3 -m unittest discover -s scripts -p 'test_release.py'
      - run: python3 scripts/generate_notices.py --check

  private-tor:
    name: Private offline Tor
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: sudo apt-get update
      - run: sudo apt-get install --yes --no-install-recommends tor
      - env:
          RUSTUP_TOOLCHAIN: stable
        run: python3 scripts/test_local_tor.py --tor /usr/bin/tor --release --accounting
