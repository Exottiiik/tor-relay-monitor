name: Prepare release artifacts

# Builds downloadable assets only. A maintainer publishes the release manually.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching Cargo.toml, for example v0.5.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 (Debian 12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: rust:1.88-bookworm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - run: apt-get update
      - run: apt-get install --yes --no-install-recommends python3
      - name: Verify selected release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != 'v' + version:
              raise SystemExit('Tag must match the package version')
          tagged = subprocess.check_output(['git', 'rev-parse', '--verify', 'refs/tags/' + tag + '^{commit}'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if tagged != head:
              raise SystemExit('Checkout must match the selected tag')
          PY
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: python3 -m unittest discover -s scripts -p 'test_release.py'
      - run: python3 scripts/generate_notices.py --check
      - run: python3 scripts/package_release.py --output dist/release
      - run: python3 scripts/verify_release.py --directory dist/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trm-release-linux-x86_64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
